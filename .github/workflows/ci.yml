name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install without the optional SDK
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # The default path must work with the SDK absent: the SDK tests skip and
      # the offline suite still has to be green.
      - name: Test (offline only)
        run: uv run python -m pytest -rs

      - name: Install the optional live SDK
        run: uv pip install -e ".[live]"

      # With the SDK present the provider's error mapping tests un-skip.
      - name: Test (including SDK error mapping)
        run: uv run python -m pytest

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types
        run: uv run mypy
