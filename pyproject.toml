[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptproof"
version = "0.1.0"
description = "Synthetic evaluation harness for system prompts and agent skills."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kathleen Bartin", email = "kathleen@prodigalparadigm.com" }]
keywords = ["evaluation", "llm", "prompt-engineering", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
# No runtime dependencies. Offline mode is stdlib-only by design.
dependencies = []

[project.optional-dependencies]
# Live runs against the Anthropic API.
live = ["anthropic>=1.0,<2"]
# YAML spec files (TOML specs work with no extra dependency via stdlib tomllib).
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
promptproof = "promptproof.cli:main"

[project.urls]
Homepage = "https://github.com/comelyhunger/promptproof"

[tool.hatch.build.targets.wheel]
packages = ["src/promptproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "ANN", "SLF", "ISC", "BLE"]
ignore = [
  "ANN401",  # Any is occasionally the honest type
  "PLR0913", # constructors here take several explicit knobs on purpose
  "PLR2004", # magic values in comparisons are readable in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "SLF", "PLR", "PLC0415", "S101"]
